name: check

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: bash -n naiveproxy.sh
      - name: shellcheck
        run: shellcheck naiveproxy.sh
      - name: assets checksum
        run: |
          cd assets && sha256sum -c SHA256SUMS
          # 脚本内置的 ASSET_SHA256 必须与 SHA256SUMS 一致
          while read -r hash name; do
            grep -q "\[${name}\]=\"${hash}\"" ../naiveproxy.sh || { echo "ASSET_SHA256 mismatch: $name"; exit 1; }
          done < SHA256SUMS
